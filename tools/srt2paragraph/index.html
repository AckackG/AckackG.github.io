<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRT转TXT段落</title>
    <link rel="stylesheet" href="style.css" />
    <!-- 引入 JSZip 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  </head>
  <body>
    <div class="instructions">使用说明： 粘贴SRT/VTT全文，或上传字幕文件</div>
    <div class="container">
      <!-- 使用说明 -->

      <textarea
        id="jsonInput"
        placeholder="
        // 正确的格式：
        1
        00:00:01,000 --> 00:00:04,360
        text text text text text text text text text 

        2
        00:00:04,360 --> 00:00:08,940
        text text text text text text text text text 

        3
        00:00:08,940 --> 00:00:11,520
        text text text text text text text text text 
        "
      ></textarea>
      <div id="midbuttons">
        <button id="convertButton">Convert to TXT</button>
        <div>
          <span>间隔分钟:</span>
          <select id="numberDropdown">
            <option value="0.5">0.5</option>
            <option value="1">1</option>
            <option value="1.5" selected>1.5</option>
            <option value="2">2</option>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="60">60</option>
          </select>
        </div>

        <label for="file-input" class="file-input-button">批量处理字幕文件</label>
        <input type="file" id="file-input" multiple />
      </div>
      <div id="output"></div>
      <div><button id="copyButton">Copy Result</button></div>
    </div>

    <script>
      function srtToParagraphs(srtText, filename = "当前输入") {
        let hasErrors = false;
        // 将时间字符串转换为秒数，例如 "00:05:00.000" -> 300 秒
        function timeToSeconds(timeStr) {
          const [hours, minutes, seconds] = timeStr.split(":");
          return (
            parseInt(hours) * 3600 + parseInt(minutes) * 60 + parseFloat(seconds.replace(",", "."))
          );
        }

        // 解析 SRT 格式的内容
        const srtEntries = srtText.split("\n\n"); // 分割每个条目
        let paragraphs = [];
        let currentParagraph = "";
        let lastTime = 0;
        const interval = parseFloat(document.getElementById("numberDropdown").value) * 60;

        srtEntries.forEach((entry) => {
          if (!entry.trim()) return; // 跳过空的条目

          try {
            const lines = entry.split("\n");
            const timeLineIndex = lines.findIndex((line) => line.includes("-->"));

            if (timeLineIndex === -1) {
              return;
            }

            const timeLine = lines[timeLineIndex];
            const text = lines
              .slice(timeLineIndex + 1)
              .join("\n")
              .trim();
            const [start, end] = timeLine.split(" --> ");

            if (!start || !end) {
              return;
            }

            const startTime = timeToSeconds(start.trim());

            if (startTime - lastTime >= interval) {
              if (currentParagraph) {
                if (currentParagraph.endsWith(",")) {
                  currentParagraph = currentParagraph.slice(0, -1);
                }
                paragraphs.push(
                  `${(lastTime / 60).toFixed(1)}min --> ${(startTime / 60).toFixed(
                    1
                  )}min \n${currentParagraph.trim()}`
                );
              }
              currentParagraph = "";
              lastTime = startTime;
            }

            if (text) {
              currentParagraph += text + ",";
            }
          } catch (error) {
            console.error(`文件 "${filename}" 处理失败，出错的内容行:`);
            console.error("▼▼▼ 出错内容块 ▼▼▼");
            console.error(entry);
            console.error("▲▲▲ 出错内容块 ▲▲▲");
            hasErrors = true;
          }
        });

        if (currentParagraph) {
          if (currentParagraph.endsWith(",")) {
            currentParagraph = currentParagraph.slice(0, -1);
          }
          paragraphs.push(`${(lastTime / 60).toFixed(1)}min --> ~min \n${currentParagraph.trim()}`);
        }

        return {
          output: paragraphs.join("\n\n"),
          hasErrors: hasErrors,
        };
      }

      document.getElementById("convertButton").addEventListener("click", function () {
        const jsonInput = document.getElementById("jsonInput").value;
        const result = srtToParagraphs(jsonInput);
        document.getElementById("output").textContent = result.output;
      });

      document.getElementById("copyButton").addEventListener("click", function () {
        const output = document.getElementById("output");
        navigator.clipboard.writeText(output.textContent).then(
          () => {
            alert("Result copied to clipboard!");
          },
          () => {
            alert("Failed to copy result to clipboard.");
          }
        );
      });

      function changeFileExtensionToTXT(filename) {
        const lastDotIndex = filename.lastIndexOf(".");
        if (lastDotIndex === -1) {
          return filename + ".txt";
        } else {
          return filename.substring(0, lastDotIndex) + ".txt";
        }
      }

      document.getElementById("file-input").addEventListener("change", async (event) => {
        // 改为 async 函数
        const files = event.target.files;
        const totalFiles = files.length;
        if (totalFiles === 0) return;

        let successCount = 0;
        const zip = new JSZip(); // 创建一个 JSZip 实例

        console.clear();
        console.log(`--- 开始批量处理，共 ${totalFiles} 个文件 ---`);

        const filePromises = Array.from(files).map((file) => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
              const content = e.target.result;
              const result = srtToParagraphs(content, file.name);

              if (!result.hasErrors) {
                successCount++;
              }

              // 将处理好的文件内容添加到 zip 对象中
              zip.file(changeFileExtensionToTXT(file.name), result.output);
              resolve();
            };
            reader.onerror = (e) => {
              console.error(`读取文件 "${file.name}" 失败。`);
              reject(e);
            };
            reader.readAsText(file);
          });
        });

        // 等待所有文件都读取和处理完毕
        await Promise.all(filePromises);

        console.log("-----------------------------------------");
        console.log(`批量处理完成。成功: ${successCount} / ${totalFiles}`);
        if (successCount < totalFiles) {
          console.log("提示：部分文件在处理时检测到格式错误，详情请查看上方日志。");
        }

        // 生成 ZIP 文件并触发下载
        if (successCount > 0) {
          zip.generateAsync({ type: "blob" }).then(function (content) {
            downloadFile("converted_subtitles.zip", content);
          });
        }
      });

      function downloadFile(filename, content) {
        const element = document.createElement("a");
        // 如果 content 是 Blob (来自zip)，则创建 URL
        if (content instanceof Blob) {
          element.href = URL.createObjectURL(content);
        } else {
          element.setAttribute(
            "href",
            "data:text/plain;charset=utf-8," + encodeURIComponent(content)
          );
        }

        element.setAttribute("download", filename);
        element.style.display = "none";
        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);

        // 释放创建的 URL 对象
        if (content instanceof Blob) {
          URL.revokeObjectURL(element.href);
        }
      }
    </script>
  </body>
</html>
